<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Кафе Вакт - Вкусные стрипсы, крылья, твистеры и бургеры с быстрой доставкой</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Стрипсы, крылья, твистеры и бургеры с быстрой доставкой.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Rubik:ital,wght@1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="logo logo--text" id="logo" href="./" aria-label="Вакт — на главную">ВАКТ</a>
      <a class="header__phone" id="headerPhone" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
        <span></span>
      </a>
    </div>
  </header>

  <main class="container layout">
    <div class="menu">
      <div class="menu__categories">
        <nav class="categories" id="categories" aria-label="Категории"></nav>
      </div>
      <div class="menu__content" id="sections"></div>
    </div>

    <aside class="cart" id="cart" aria-label="Корзина">
      <div class="cart__head">
        <div class="cart__title">
          <h2>Корзина</h2>
          <span class="cart__count" id="cartCount" hidden>0</span>
        </div>
        <button class="icon-btn" id="clearCart" type="button" aria-label="Очистить корзину">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn cart__close" id="closeCart" type="button" aria-label="Закрыть корзину">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="cart__panel">
        <div class="cart__body" id="cartBody"></div>
        <div class="cart__foot">
          <div class="cart__total"><span>Итого</span><strong id="cartTotal">0 смн</strong></div>
          <button class="btn btn--order" id="orderBtn" type="button" disabled>Заказать</button>
        </div>
      </div>
    </aside>
  </main>

  <button class="cart-bar" id="cartBar" type="button" hidden>
    <span class="cart-bar__count" id="cartBarCount">0</span>
    <span>Корзина</span>
    <strong id="cartBarTotal">0 смн</strong>
  </button>
  <div class="scrim" id="cartScrim" hidden></div>

  <dialog class="modal" id="checkout" aria-labelledby="checkoutTitle">
    <form class="checkout" id="checkoutForm" novalidate>
      <div class="checkout__head">
        <h2 id="checkoutTitle">Оформление заказа</h2>
        <div class="checkout__sum">
          <strong id="checkoutTotal">0 смн</strong>
          <small>Без учета доставки</small>
        </div>
      </div>

      <div class="checkout__body">
      <div class="checkout__grid">
        <label class="field">
          <span>Ваш номер телефон</span>
          <input name="phone" type="tel" inputmode="tel" placeholder="Введите номер" value="+992 " autocomplete="tel" required>
          <em class="field__error">Введите номер в формате +992 XX XXX XX XX</em>
        </label>
        <label class="field">
          <span>Выберите точку</span>
          <select name="point_id" id="pointSelect"></select>
        </label>
      </div>

      <fieldset class="field">
        <legend>Приготовить заказ</legend>
        <div class="radios">
          <label class="radio"><input type="radio" name="order_is_now" value="1" checked><span>Сейчас</span></label>
          <label class="radio"><input type="radio" name="order_is_now" value="0"><span>Указать</span></label>
        </div>
        <input class="field__extra" name="order_time" type="time" hidden aria-label="Время приготовления">
      </fieldset>

      <fieldset class="field">
        <legend>Способ доставки</legend>
        <div class="radios">
          <label class="radio"><input type="radio" name="order_is_delivery" value="1" checked><span>Доставка</span></label>
          <label class="radio"><input type="radio" name="order_is_delivery" value="0"><span>Самовывоз</span></label>
        </div>
      </fieldset>

      <label class="field" id="addressField">
        <span>Ваш адрес (улица, ориентир)</span>
        <input name="delivery_address" type="text" autocomplete="street-address">
        <em class="field__error">Укажите адрес доставки</em>
      </label>

      <fieldset class="field">
        <legend>Способ оплаты</legend>
        <div class="radios" id="bankRadios"></div>
      </fieldset>

      <label class="field">
        <span>Примечания к заказу</span>
        <input name="comment" type="text">
      </label>
      </div>

      <div class="checkout__actions">
        <button class="btn btn--ghost" type="button" id="cancelCheckout">Отмена</button>
        <button class="btn btn--primary" type="submit">Оформить заказ</button>
      </div>
    </form>

    <div class="success" id="success" hidden>
      <div class="success__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>Заказ оформлен!</h2>
      <p>Мы свяжемся с вами по номеру <b id="successPhone"></b> для подтверждения.</p>
      <button class="btn btn--primary" type="button" id="successClose">Хорошо</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/menu.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
